<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">QWindow logo</title>
  <desc id="desc">Layered floating window panels for QWindow.</desc>
  <defs>
    <linearGradient id="bg" x1="14" x2="114" y1="14" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b2440" />
      <stop offset="1" stop-color="#08111f" />
    </linearGradient>
    <linearGradient id="front" x1="34" x2="103" y1="34" y2="99" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28d8ca" />
      <stop offset="1" stop-color="#2385ff" />
    </linearGradient>
    <linearGradient id="back" x1="20" x2="87" y1="20" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffcf5a" />
      <stop offset="1" stop-color="#ff7a59" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".32" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)" />
  <g filter="url(#shadow)">
    <rect x="22" y="24" width="74" height="58" rx="12" fill="url(#back)" opacity=".92" />
    <rect x="22" y="24" width="74" height="17" rx="12" fill="#fff" opacity=".22" />
    <circle cx="35" cy="33" r="3" fill="#fff" opacity=".8" />
    <circle cx="45" cy="33" r="3" fill="#fff" opacity=".55" />
    <circle cx="55" cy="33" r="3" fill="#fff" opacity=".4" />
    <rect x="36" y="42" width="74" height="62" rx="12" fill="url(#front)" />
    <rect x="36" y="42" width="74" height="18" rx="12" fill="#fff" opacity=".2" />
    <circle cx="50" cy="51" r="3" fill="#fff" opacity=".9" />
    <circle cx="60" cy="51" r="3" fill="#fff" opacity=".62" />
    <circle cx="70" cy="51" r="3" fill="#fff" opacity=".45" />
    <path
      d="M58 80h30M73 65v30M63 70l10-10 10 10M63 90l10 10 10-10"
      fill="none"
      stroke="#fff"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="6"
      opacity=".9"
    />
  </g>
</svg>
