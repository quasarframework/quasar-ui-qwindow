<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width"
    />

    <title>UMD test</title>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/quasar@^2.0.0/dist/quasar.prod.css"
      rel="stylesheet"
      type="text/css"
    />
    <link href="dist/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div id="q-app">
      <q-layout view="lHh Lpr fff">
        <q-header class="glossy bg-primary">
          <q-toolbar>
            <q-toolbar-title> QWindow v{{ version }} </q-toolbar-title>

            <div>Quasar v{{ $q.version }}</div>
          </q-toolbar>
        </q-header>

        <q-page-container>
          <q-page padding>
            <ul class="q-mb-lg">
              <li>In /packages/ui, run: "pnpm build"</li>
              <li class="text-red">You need to build & refresh page on each change manually.</li>
            </ul>

            <q-window v-model="showing" title="UMD QWindow" :width="360" :height="220">
              <div class="q-pa-md">This panel is loaded from the UMD bundle.</div>
            </q-window>
          </q-page>
        </q-page-container>
      </q-layout>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@^3.0.0/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quasar@^2.0.0/dist/quasar.umd.prod.js"></script>
    <script src="dist/index.umd.js"></script>

    <script>
      const { ref } = Vue

      const app = Vue.createApp({
        setup() {
          const showing = ref(true)

          return {
            version: QWindow.version,
            showing,
          }
        },
      })
      app.use(Quasar)
      app.use(QWindow)
      app.mount("#q-app")
    </script>
  </body>
</html>
